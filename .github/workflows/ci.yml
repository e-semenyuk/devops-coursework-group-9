name: CI

on:
  push:
    branches:
      - master
      - develop
      - release
      - "release/**"
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop
      - release

permissions:
  contents: read

jobs:
  maven:
    name: Build and test JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: population-reporting-system
          path: target/population-reporting-system.jar

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: group9/population-reporting-system:ci
