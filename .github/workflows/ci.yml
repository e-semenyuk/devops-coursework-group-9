name: CI

on:
  push:
    branches:
      - master
      - develop
      - release
      - "release/**"
      - "release-*"
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop
      - release
      - "release/**"
      - "release-*"
      - "codex/**"

permissions:
  contents: read

jobs:
  maven:
    name: Build and test JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: population-reporting-system
          path: target/population-reporting-system.jar

      - name: Upload unit-test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: target/site/jacoco

      - name: Upload unit-test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          flags: unit-tests
          fail_ci_if_error: false

  integration-tests:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: world
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pexample"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for MySQL health check
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' '${{ job.services.mysql.id }}')
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker inspect '${{ job.services.mysql.id }}'
          exit 1

      - name: Load MySQL integration-test fixture
        run: docker exec -i '${{ job.services.mysql.id }}' mysql -uroot -pexample world < src/test/resources/mysql-fixture.sql

      - name: Run MySQL integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: world
          DB_USER: root
          DB_PASSWORD: example
        run: mvn --batch-mode --no-transfer-progress -P integration-tests verify

      - name: Upload integration-test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: target/site/jacoco-it

      - name: Upload integration-test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco-it/jacoco.xml
          flags: integration-tests
          fail_ci_if_error: false

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: group9/population-reporting-system:ci
